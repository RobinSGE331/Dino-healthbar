name: Release

on:
  push:
    tags: ['v*']
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Release bei Tag-Push oder bei einem Commit mit "[release]" in der Nachricht.
    if: startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --no-daemon
      - name: Read version
        id: ver
        run: echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/dino-healthbar-*.jar
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Dino Health Bar v${{ steps.ver.outputs.version }}
          make_latest: true
          body: |
            Client-Mod für **Fabric 1.21.11**: zeigt die Herzen von Mobs/Custom-Dinos (auch mit 3D-Modellen) als Bossbar.

            **Installation:** Fabric Loader + Fabric API (1.21.11) installieren, die `.jar` in den `mods`-Ordner legen.

            Taste `H` = an/aus · `/dinobar` = Einstellungen · `/dinobar debug` = Fehlersuche
