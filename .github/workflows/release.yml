name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --no-daemon
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/dino-healthbar-*.jar
          name: Dino Health Bar ${{ github.ref_name }}
          body: |
            Client-Mod für **Fabric 1.21.11**: zeigt die Herzen von Mobs/Custom-Dinos (auch mit 3D-Modellen) als Bossbar.

            **Installation:** Fabric Loader + Fabric API (1.21.11) installieren, die `.jar` in den `mods`-Ordner legen.

            Taste `H` = an/aus · `/dinobar` = Einstellungen · `/dinobar debug` = Fehlersuche
